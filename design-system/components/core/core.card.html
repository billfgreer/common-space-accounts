<!-- @dsCard group="Components" viewport="700x300" subtitle="Button · Tag · Stat · Quote — core primitives" name="Core primitives" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
 body{margin:0;background:var(--cs-paper);color:var(--cs-ink);padding:26px;font-family:var(--font-mono);display:flex;flex-direction:column;gap:22px}
 .lab{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--cs-mute-soft);margin-bottom:12px}
 .row{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
 .btn{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;border:1.5px solid var(--cs-ink);padding:13px 20px}
 .primary{background:var(--cs-ink);color:var(--cs-on-ink)}
 .circle{border:none;border-radius:999px;width:88px;height:88px;justify-content:center;background:var(--cs-yellow);font-size:12px;text-align:center}
 .lnk{border:none;padding:0 0 3px;border-bottom:2px solid var(--cs-yellow);text-transform:none}
 .tag{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:8px 14px;border:1px solid var(--cs-ink)}
 .dot{width:8px;height:8px;border-radius:50%}
 .stat{font-family:var(--font-display);font-weight:900;font-size:46px;line-height:1;letter-spacing:-.02em}
 .stat .l{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--cs-mute);margin-top:10px;font-weight:400}
</style></head>
<body>
 <div>
  <div class="lab">Buttons</div>
  <div class="row">
   <div class="circle">About&nbsp;&gt;&gt;</div>
   <div class="btn primary">JOIN US <span style="color:var(--cs-yellow)">&gt;&gt;</span></div>
   <div class="btn">DONATE <span>&gt;&gt;</span></div>
   <div class="btn lnk">Read the mission brief&nbsp;&gt;&gt;</div>
  </div>
 </div>
 <div>
  <div class="lab">Tags · Stat</div>
  <div class="row">
   <span class="tag"><span class="dot" style="background:var(--cs-magenta)"></span>Disasters</span>
   <span class="tag"><span class="dot" style="background:var(--cs-cyan)"></span>Food security</span>
   <span class="tag"><span class="dot" style="background:var(--cs-yellow)"></span>Human rights</span>
   <div style="margin-left:8px"><div class="stat">75<span style="color:var(--cs-magenta)">.</span></div><div class="l">Disasters mapped</div></div>
  </div>
 </div>
</body></html>
